name: Build Android APK

# 手动触发 或 推送 android/ 相关改动时自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

# 同一分支同时只跑一个构建，避免重复推送堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Set up Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools/latest/bin/" | head -5
          # 接受许可 + 安装 compileSdk 35 所需组件（缺失时 AGP 无法自动下载会直接失败）
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || echo "licenses: 已接受或无需处理"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" || echo "SDK 组件已存在"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
