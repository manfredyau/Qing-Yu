# 轻遇 (Qingyu) · Kamal 2 部署配置
#
# 使用前需替换三处占位：
#   1. image / registry —— 你的镜像仓库（GHCR / Docker Hub / 阿里云 ACR 等）
#   2. servers.web —— 你的服务器 IP
#   3. proxy.host —— 你的域名（启用 HTTPS 时）
# 所有密码类配置只通过 .kamal/secrets 注入，不要写在这里。

service: qingyu

# 容器镜像名（registry.server 已含 ghcr.io，这里只写 账号/镜像名）
image: your-github-name/qingyu

# 部署目标服务器（替换为你的真实 IP）
servers:
  web:
    - 1.2.3.4
  # 多服务器/独立 Job 进程时启用：
  # job:
  #   hosts:
  #     - 1.2.3.4
  #   cmd: bin/jobs

# 启用 Let's Encrypt 自动 HTTPS + Traefik 反向代理
# 使用前：替换 host 为你的域名，并在 production.rb 打开 config.assume_ssl / config.force_ssl
proxy:
  ssl: true
  host: app.example.com

# 镜像仓库（替换为你的实际仓库）
registry:
  server: ghcr.io
  username: your-github-name
  # 从 .kamal/secrets 读取仓库访问令牌（GHCR 用 GitHub PAT，权限 packages:write）
  password:
    - KAMAL_REGISTRY_PASSWORD

# 注入容器的环境变量
env:
  secret:
    - RAILS_MASTER_KEY
    - QINGYU_DATABASE_PASSWORD
    - ID_CARD_PROVIDER
    - EDUCATION_PROVIDER
  clear:
    # Solid Queue 随 Puma 进程内运行（单机部署推荐；多机时拆出独立 job 服务器）
    SOLID_QUEUE_IN_PUMA: true
    # 数据库指向同机的 Postgres accessory（Kamal docker 网络内主机名）
    DB_HOST: qingyu-db
    DB_USERNAME: postgres
    # RAILS_LOG_LEVEL: debug

# 快捷命令：bin/kamal console / logs / dbc ...
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# 持久化 Active Storage 本地文件（生产推荐换 S3 等对象存储）
volumes:
  - "qingyu_storage:/rails/storage"

# 新旧版本间桥接指纹资源，避免部署瞬间 404
asset_path: /rails/public/assets

# 镜像构建
builder:
  arch: amd64

# PostgreSQL 数据库 accessory（与应用同机）
accessories:
  db:
    image: postgres:17
    host: 1.2.3.4   # 与应用同机，填服务器 IP
    port: "127.0.0.1:5432:5432"   # 仅本机可连，不对外暴露
    env:
      clear:
        POSTGRES_USER: postgres
      secret:
        - QINGYU_DATABASE_PASSWORD   # 即 POSTGRES_PASSWORD，与应用连接密码一致
    files:
      - config/init/production.sql:/docker-entrypoint-initdb.d/001_create_databases.sql
    directories:
      - data:/var/lib/postgresql/data
